<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Người Việt Today | Tin Tức Thời Sự Hoa Kỳ & Đời Sống Người Việt Tại Hoa Kỳ</title>
  
  <link rel="icon" type="image/png" href="https://img.icons8.com/color/48/usa.png">

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Merriweather:ital,wght@0,400;0,700;1,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  
  <style>
    :root {
      --primary-blue: #1d4ed8;
      --accent-red: #e11d48;
      --accent-purple: #7c3aed;
      --accent-orange: #ff5b00;
      --bg-body: #f8fafc;
      --bg-card: #ffffff;
      --bg-subtle: #f1f5f9;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --shadow-card: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
      --shadow-hover: 0 14px 28px -4px rgba(0, 0, 0, 0.1);
      --font-body: 'Plus Jakarta Sans', sans-serif;
      --font-serif: 'Merriweather', Georgia, serif;
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body.dark-mode {
      --bg-body: #090d16;
      --bg-card: #131b2e;
      --bg-subtle: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #1e293b;
      --shadow-card: 0 4px 20px -2px rgba(0, 0, 0, 0.4);
      --shadow-hover: 0 14px 28px -4px rgba(0, 0, 0, 0.6);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-body);
      color: var(--text-main);
      font-family: var(--font-body);
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    a { text-decoration: none; color: inherit; }

    /* TOP ANNOUNCEMENT BAR */
    .top-strip {
      background: #020617;
      color: #94a3b8;
      padding: 0.45rem 1.5rem;
      font-size: 0.78rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      gap: 15px;
      flex-wrap: wrap;
    }

    .top-strip-left {
      display: flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
    }

    .top-strip-market {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.75rem;
    }

    .market-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(255,255,255,0.06);
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.1);
      white-space: nowrap;
    }

    .market-up { color: #10b981; font-weight: 700; }
    .market-usd { color: #38bdf8; font-weight: 800; }

    .breaking-tag {
      background: var(--accent-red);
      color: white;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 4px;
      letter-spacing: 0.5px;
      animation: pulseRed 2s infinite;
    }

    @keyframes pulseRed { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

    /* MAIN HEADER */
    header {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 1000;
      transition: var(--transition);
    }

    .header-container {
      max-width: 1320px;
      margin: 0 auto;
      padding: 0.85rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1.2rem;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.65rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text-main);
      white-space: nowrap !important;
      flex-shrink: 0;
    }

    .brand-logo .logo-badge {
      background: linear-gradient(135deg, #1d4ed8, #e11d48);
      color: white;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 900;
      flex-shrink: 0;
    }

    .brand-logo span { color: var(--accent-red); }

    .header-search {
      position: relative;
      flex: 1;
      max-width: 380px;
    }

    .header-search input {
      width: 100%;
      background: var(--bg-subtle);
      border: 1px solid var(--border-color);
      padding: 0.55rem 1rem 0.55rem 2.3rem;
      border-radius: 25px;
      outline: none;
      font-size: 0.85rem;
      color: var(--text-main);
      transition: var(--transition);
    }

    .header-search input:focus {
      border-color: var(--primary-blue);
      box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.12);
    }

    .header-search i {
      position: absolute;
      left: 0.9rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .toggle-btn {
      background: var(--bg-subtle);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition);
    }

    .toggle-btn:hover {
      background: var(--primary-blue);
      color: white;
      border-color: var(--primary-blue);
    }

    .lang-group {
      display: flex;
      background: var(--bg-subtle);
      padding: 3px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
    }

    .lang-item {
      background: transparent;
      color: var(--text-muted);
      border: none;
      padding: 4px 10px;
      border-radius: 15px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.75rem;
      transition: var(--transition);
    }

    .lang-item.active {
      background: var(--primary-blue);
      color: white;
    }

    .mobile-menu-toggle {
      display: none;
      background: none;
      border: none;
      font-size: 1.3rem;
      color: var(--text-main);
      cursor: pointer;
    }

    /* NAVIGATION BAR */
    nav {
      border-top: 1px solid var(--border-color);
      background: var(--bg-card);
    }

    .nav-inner {
      max-width: 1320px;
      margin: 0 auto;
      padding: 0 1.5rem;
      display: flex;
      gap: 1.8rem;
      overflow-x: auto;
      white-space: nowrap;
      align-items: center;
    }

    .nav-tab {
      color: var(--text-main);
      padding: 0.75rem 0;
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .nav-tab:hover, .nav-tab.active {
      color: var(--primary-blue);
      border-bottom-color: var(--primary-blue);
    }

    .nav-deal-btn {
      margin-left: auto;
      background: linear-gradient(135deg, #ff5b00, #ea580c);
      color: white !important;
      font-size: 0.78rem;
      font-weight: 800;
      padding: 5px 12px;
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      box-shadow: 0 2px 10px rgba(255, 91, 0, 0.3);
      transition: var(--transition);
    }

    .nav-deal-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 15px rgba(255, 91, 0, 0.5);
    }

    /* CATEGORY SHOWCASE BAR */
    .cat-showcase-bar {
      max-width: 1320px;
      margin: 1.5rem auto 0;
      padding: 0 1.5rem;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
    }

    .cat-pill-card {
      padding: 1.1rem 1rem;
      border-radius: var(--radius-md);
      color: white;
      font-weight: 800;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      box-shadow: var(--shadow-card);
      transition: var(--transition);
      position: relative;
      overflow: hidden;
    }

    .cat-pill-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-hover);
    }

    .cat-c1 { background: linear-gradient(135deg, #4f46e5, #7c3aed); }
    .cat-c2 { background: linear-gradient(135deg, #0284c7, #2563eb); }
    .cat-c3 { background: linear-gradient(135deg, #e11d48, #f43f5e); }
    .cat-c4 { background: linear-gradient(135deg, #059669, #10b981); }
    .cat-c5 { background: linear-gradient(135deg, #d97706, #f59e0b); }

    /* LAYOUT CONTAINER */
    .main-wrap {
      max-width: 1320px;
      margin: 1.5rem auto 3rem;
      padding: 0 1.5rem;
      display: grid;
      grid-template-columns: 2.85fr 1.15fr;
      gap: 2rem;
      flex: 1;
    }

    /* HERO MAGAZINE GRID */
    .foxiz-hero {
      display: grid;
      grid-template-columns: 1.1fr 1.6fr;
      gap: 16px;
      margin-bottom: 2.2rem;
    }

    .hero-list-side {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .hero-mini-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 10px;
      display: flex;
      gap: 12px;
      align-items: center;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: var(--shadow-card);
      flex: 1;
    }

    .hero-mini-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
      border-color: var(--primary-blue);
    }

    .hero-mini-thumb {
      width: 88px;
      height: 76px;
      border-radius: var(--radius-sm);
      object-fit: cover;
      flex-shrink: 0;
    }

    .hero-big-card {
      position: relative;
      border-radius: var(--radius-lg);
      overflow: hidden;
      cursor: pointer;
      min-height: 380px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 1.8rem;
      box-shadow: var(--shadow-card);
    }

    .hero-big-card img.hero-bg-img {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover;
      transition: transform 0.6s ease;
      z-index: 1;
    }
